<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestor de clientes y cumpleaños — BE WILD">
  <title>BE WILD · Clientes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!--
    Si la hoja de estilos no carga, casi seguro tampoco cargan los módulos JS:
    significa que los archivos .js tampoco están al lado de este archivo.
    En vez de mostrar una página rota sin explicación, se avisa qué pasó.
  -->
  <link rel="stylesheet" href="styles.css?v=2.3.0" onerror="window.__faltanArchivos = true">
  <!-- Los estilos agregados a partir de 2.2.0 viven en su propio archivo: así no
       hay que pegar nada al final de styles.css y no se pierden en una copia. -->
  <link rel="stylesheet" href="estilos-nuevos.css?v=2.3.0">
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (!window.__faltanArchivos) return;
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="font:14px/1.5 system-ui;background:#0A0A0A;color:#fff;padding:20px;margin:0 0 16px">' +
        '<strong>Faltan archivos.</strong> No se encontró <code>styles.css</code>. ' +
        'Todos los archivos tienen que estar en el mismo lugar que <code>index.html</code>. ' +
        'Si abriste el archivo desde adentro del ZIP, descomprimilo primero.' +
        '</div>');
    });
  </script>
</head>
<body>

  <!-- ══ Pantalla de ingreso ═════════════════════════════════════════════ -->
  <div id="pantalla-login" class="login" hidden>
    <div class="login__caja">
      <div class="login__marca">
        <span class="login__wordmark">BE WILD</span>
        <span class="login__sub">Gestión de clientes</span>
      </div>

      <p class="login__texto">
        Ingresá con la cuenta de Google del local.
      </p>

      <div id="boton-google" class="login__boton"></div>

      <p class="login__error" id="login-error" hidden></p>

      <p class="login__pie">
        Solo las cuentas autorizadas de BE WILD tienen acceso.
      </p>
    </div>
  </div>

  <!-- ══ Layout principal ════════════════════════════════════════════════ -->
  <div class="layout" id="app" hidden>

    <!-- Barra lateral -->
    <aside class="sidebar">
      <div class="sidebar__marca">
        <span class="sidebar__wordmark">BE WILD</span>
        <span class="sidebar__sub">Clientes</span>
      </div>

      <nav class="nav" id="nav-principal" aria-label="Secciones principales"></nav>

      <div class="nav__grupo-titulo">Sistema</div>
      <nav class="nav" id="nav-sistema" aria-label="Sistema"></nav>

      <div class="sidebar__pie">
        <span id="version-app">v—</span>
      </div>
    </aside>

    <!-- Contenido -->
    <div class="principal">

      <header class="topbar">
        <div class="topbar__izq">
          <h1 class="topbar__titulo" id="titulo-vista">—</h1>
          <span class="topbar__fecha" id="fecha-hoy"></span>
        </div>

        <div class="topbar__der">
          <div class="estado" id="estado-conexion" role="status" aria-live="polite">
            <span class="estado__punto"></span>
            <span class="estado__texto">Conectando…</span>
          </div>

          <div class="sesion" id="sesion" hidden>
            <span class="sesion__avatar" aria-hidden="true"></span>
            <span class="sesion__datos">
              <span class="sesion__local"></span>
              <span class="sesion__mail"></span>
            </span>
            <button class="sesion__salir" id="btn-salir" type="button" title="Cerrar sesión">Salir</button>
          </div>
        </div>
      </header>

      <main class="contenido" id="contenido" tabindex="-1"></main>

    </div>
  </div>

  <!-- Avisos flotantes -->
  <div class="avisos" id="avisos" aria-live="polite"></div>

  <script type="module" src="app.js?v=2.3.0"></script>
</body>
</html>
