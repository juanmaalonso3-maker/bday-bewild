<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --accent: #1f6feb; --accent-ink: #ffffff; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 190px; border: 2px dashed #c9c6bf; border-radius: 16px; background: var(--card);
    text-align: center; padding: 24px; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: #f3f7ff; }
  .drop .big { font-size: 19px; font-weight: 600; }
  .drop .small { color: var(--muted); font-size: 14px; }
  .drop svg { width: 40px; height: 40px; color: var(--accent); }
  input[type=file] { display: none; }
  .status { margin: 16px 0 0; font-size: 15px; min-height: 22px; }
  .status.err { color: var(--err); } .status.ok { color: var(--ok); } .status.warn { color: var(--warn); }
  .result { display: none; margin-top: 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; }
  .result.show { display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 11px 16px; cursor: pointer; font-weight: 600; }
  button:hover { border-color: #bdbab3; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.06); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
  .labels { display: flex; flex-wrap: wrap; gap: 14px; }
  .labels figure { margin: 0; }
  .labels img { display: block; width: 170px; height: auto; aspect-ratio: auto; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .labels figcaption { font-size: 12.5px; color: var(--muted); margin-top: 4px; text-align: center; }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  textarea { width: 100%; height: 160px; margin-top: 8px; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
  .settings { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 10px; font-size: 14px; }
  .settings label { display: flex; align-items: center; gap: 6px; }
  .settings input[type=number] { width: 74px; font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; }
  .warnlist { font-size: 13px; color: var(--warn); margin: 8px 0 0; }
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    html, body { background: #fff; margin: 0; padding: 0; }
    #printArea { display: block; }
    #printArea img { display: block; break-after: page; page-break-after: always; }
    #printArea img:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
<style id="pageSize">@page { size: 100mm 190mm; margin: 0; }</style>
</head>
<body>
<main>
  <h1>Etiquetas de MercadoEnvíos</h1>
  <p class="sub">Subí el zip que descarga MercadoLibre y te devuelvo el PDF listo para la impresora térmica.</p>

  <label class="drop" id="drop" for="file">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <div class="big">Soltá acá el zip de la etiqueta</div>
    <div class="small">o tocá para elegirlo · también acepta el .txt o el .pdf sueltos</div>
  </label>
  <input type="file" id="file" accept=".zip,.txt,.zpl,.pdf,application/zip,application/pdf,text/plain" multiple>

  <div class="status" id="status"></div>

  <section class="result" id="result">
    <div class="actions">
      <button class="primary" id="btnDownload">Descargar PDF</button>
      <button id="btnPrint">Imprimir</button>
      <button id="btnCopy">Copiar código ZPL</button>
      <button id="btnReset">Cargar otra</button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="labels" id="labels"></div>
    <div class="warnlist" id="warnlist"></div>
    <details id="zplBox">
      <summary>Ver código ZPL (para mandarlo directo a la impresora)</summary>
      <textarea id="zplText" readonly></textarea>
    </details>
  </section>

  <details>
    <summary>Tamaño de la etiqueta</summary>
    <div class="settings">
      <label>Ancho <input type="number" id="wmm" min="20" max="300" step="1" value="100"> mm</label>
      <label>Largo <input type="number" id="hmm" min="20" max="400" step="1" value="190"> mm</label>
    </div>
  </details>
</main>
<div id="printArea"></div>

        const lw = meas(ln);
        const lx = just === "C" ? (blockW - lw) / 2 : just === "R" ? blockW - lw : 0;
        ctx.save(); ctx.translate(lx, k * adv + h * BASE); ctx.scale(sx, 1); ctx.fillText(ln, 0, 0); ctx.restore();
      });
    });
  }

  function drawBox(ctx, f) {
    const a = f.gb; let t = Math.max(1, num(a[2], 1));
    let w = Math.max(num(a[0], t), t), h = Math.max(num(a[1], t), t);
    const color = (a[3] || "B").toUpperCase(), round = Math.min(8, num(a[4], 0));
    const rev = f.rev, white = color === "W";
    placed(ctx, f, w, h, () => {
      if (white && !rev) { ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#fff"; } else ink(ctx, rev);
      const r = round ? (round / 8) * Math.min(w, h) / 2 : 0;
      ctx.beginPath();
      if (r && ctx.roundRect) {
        ctx.roundRect(0, 0, w, h, r);
        if (t * 2 < Math.min(w, h)) ctx.roundRect(t, t, w - 2 * t, h - 2 * t, Math.max(0, r - t));
        ctx.fill("evenodd");
      } else if (t * 2 >= Math.min(w, h)) ctx.fillRect(0, 0, w, h);
      else { ctx.fillRect(0, 0, w, t); ctx.fillRect(0, h - t, w, t); ctx.fillRect(0, t, t, h - 2 * t); ctx.fillRect(w - t, t, t, h - 2 * t); }
    });
  }
  function drawCircle(ctx, f) {
    const a = f.gc; const d = num(a[0], 3), t = Math.min(num(a[1], 1), d / 2), white = (a[2] || "B").toUpperCase() === "W";
    placed(ctx, f, d, d, () => {
      if (white && !f.rev) { ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#fff"; } else ink(ctx, f.rev);
      ctx.beginPath(); ctx.arc(d / 2, d / 2, d / 2, 0, Math.PI * 2);
      if (d / 2 - t > 0) ctx.arc(d / 2, d / 2, d / 2 - t, 0, Math.PI * 2, true);
      ctx.fill("evenodd");
    });
  }
  function drawDiag(ctx, f) {
    const a = f.gd; const t = num(a[2], 1), w = Math.max(num(a[0], t), t), h = Math.max(num(a[1], t), t);
    const white = (a[3] || "B").toUpperCase() === "W", left = (a[4] || "R").toUpperCase() === "L";
    placed(ctx, f, w, h, () => {
      if (white && !f.rev) { ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#fff"; } else ink(ctx, f.rev);
      ctx.beginPath();
      if (left) { ctx.moveTo(0, 0); ctx.lineTo(t, 0); ctx.lineTo(w, h); ctx.lineTo(w - t, h); }
      else { ctx.moveTo(0, h); ctx.lineTo(w - t, 0); ctx.lineTo(w, 0); ctx.lineTo(t, h); }
      ctx.closePath(); ctx.fill();
    });
  }
  function drawGraphic(ctx, f) {
    const g = f.gfData; if (!g) return;
    const wpx = g.bpr * 8, hpx = g.rows.length;
    const c = document.createElement("canvas"); c.width = wpx; c.height = hpx;
    const cx = c.getContext("2d"), img = cx.createImageData(wpx, hpx);
    const col = f.rev ? 255 : 0;
    g.rows.forEach((row, y) => {
      for (let x = 0; x < wpx; x++) if (row[x >> 3] & (0x80 >> (x & 7))) {
        const i = (y * wpx + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = col; img.data[i + 3] = 255;
      }
    });
    cx.putImageData(img, 0, 0);
    placed(ctx, f, wpx, hpx, () => {
      ctx.globalCompositeOperation = f.rev ? "difference" : "source-over";
      ctx.imageSmoothingEnabled = false; ctx.drawImage(c, 0, 0);
    });
  }
  function drawC128(ctx, f, st, warn) {
    const a = f.bc; const orient = (a[0] || st.fw || "N").toUpperCase();
    const h = num(a[1], st.by.h), interp = (a[2] || "Y").toUpperCase() !== "N", above = (a[3] || "N").toUpperCase() === "Y";
    const mode = (a[5] || "N").toUpperCase();
    const mw = st.by.w;
    let enc;
    try { enc = C128.encode(f.text, mode); } catch (e) { warn("Código de barras inválido"); return; }
    const total = enc.widths.reduce((s, v) => s + v, 0) * mw;
    const th = interp ? Math.round(10 + 5 * mw) : 0;
    const boxH = h + (interp ? th + 4 : 0);
    const ff = Object.assign({}, f, { orient, kind: "bar" });
    if (f.ft) ff.y = f.y - h + boxH; // FT refers to the bottom of the bars
    placed(ctx, ff, total, boxH, () => {
      ink(ctx, f.rev);
      const y0 = interp && above ? th + 4 : 0;
      let x = 0;
      enc.widths.forEach((wd, i) => { const ww = wd * mw; if (i % 2 === 0) ctx.fillRect(x, y0, ww, h); x += ww; });
      if (interp) {
        ctx.font = `400 ${th}px ${FONT_STACK}`; ctx.textAlign = "center";
        ctx.fillText(enc.human, total / 2, above ? th * 0.85 : h + 3 + th * 0.85); ctx.textAlign = "start";
      }
    });
  }
  function drawQR(ctx, f, st, warn) {
    const a = f.bq; const mag = Math.max(1, Math.min(10, num(a[2], 3))); let ecl = (a[3] || "Q").toUpperCase();
    let d = f.text, m = d.match(/^([HQML])([AM]),?/i);
    if (m) {
      ecl = m[1].toUpperCase(); d = d.slice(m[0].length);
      if (m[2].toUpperCase() === "M") { // manual mode: N/A/B(nnnn)/K prefix
        const mm = d.match(/^([NAK])|^B(\d{4})/i); if (mm) d = d.slice(mm[0].length);
      }
    }
    let mat;
    try { mat = QR.encode(d, ecl); } catch (e) { warn("QR inválido"); return; }
    const n = mat.length, s = n * mag;
    const ff = Object.assign({}, f, { orient: "N", kind: "bar" });
    placed(ctx, ff, s, s, () => {
      ink(ctx, f.rev);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (mat[y][x]) ctx.fillRect(x * mag, y * mag, mag, mag);
    });
  }

  // --- main label render -------------------------------------------------
  async function renderLabel(body, opts) {
    const DPMM = 8, S = opts.scale || 2;
    const Wd = Math.round(opts.wmm * DPMM), Hd = Math.round(opts.hmm * DPMM);
    const canvas = document.createElement("canvas"); canvas.width = Wd * S; canvas.height = Hd * S;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    const warnings = new Set(); const warn = w => warnings.add(w);
    const st = { lh: { x: 0, y: 0 }, by: { w: 2, r: 3, h: 10 }, cf: { name: "0", h: 18, w: null }, fw: "N", utf8: true, lr: false, po: "N" };
    let f = null;
    const newField = () => ({ x: st.lh.x, y: st.lh.y, ft: false, font: null, fb: null, rev: st.lr, fh: null, text: null, orient: null });
    const queue = [];
    const flush = () => {
      if (!f) return;
      if (f.fh != null && f.text != null) f.text = decodeFH(f.text, f.fh, st.utf8);
      if (f.gb || f.gc || f.gd || f.gfArgs || f.bc || f.bq || f.text != null) queue.push(Object.assign({}, f, { by: Object.assign({}, st.by), cf: Object.assign({}, st.cf), fw: st.fw }));
      f = null;
    };
    for (const t of tokenize(body)) {
      const a = args(t.arg);
      switch (t.cmd) {
        case "LH": st.lh = { x: num(a[0], 0), y: num(a[1], 0) }; break;
        case "FO": case "FT":
          flush(); f = newField(); f.x = num(a[0], 0) + st.lh.x; f.y = num(a[1], 0) + st.lh.y; f.ft = t.cmd === "FT"; break;
        case "A": {
          if (!f) f = newField();
          const s = clean(t.arg); const name = (s[0] || "0").toUpperCase();
          let rest = s.slice(1), o = null;
          if (/^[NRIB]/i.test(rest)) { o = rest[0].toUpperCase(); rest = rest.slice(1); }
          const p = rest.replace(/^,/, "").split(",");
          f.font = { name: name === "@" ? "0" : name, h: num(p[0], null), w: num(p[1], null) };
          if (o) f.orient = o;
          break;
        }
        case "CF": st.cf = { name: (a[0] || "0").toUpperCase(), h: num(a[1], st.cf.h), w: num(a[2], null) }; break;
        case "FW": st.fw = (a[0] || "N").toUpperCase(); break;
        case "FB": case "TB": if (!f) f = newField();
          if (t.cmd === "FB") f.fb = { w: num(a[0], 0), lines: num(a[1], 1), spacing: num(a[2], 0), just: (a[3] || "L").toUpperCase() };
          else f.fb = { w: num(a[1], 0), lines: 99, spacing: 0, just: "L" };
          break;
        case "FR": if (!f) f = newField(); f.rev = true; break;
        case "LR": st.lr = (a[0] || "N").toUpperCase() === "Y"; break;
        case "FH": if (!f) f = newField(); f.fh = clean(t.arg)[0] || "_"; break;
        case "CI": st.utf8 = num(a[0], 0) === 28 || num(a[0], 0) === 29 || num(a[0], 0) === 30; break;
        case "FD": case "FV": if (!f) f = newField(); f.text = clean(t.arg); break;
        case "FS": flush(); break;
        case "FX": break;
        case "BY": st.by = { w: num(a[0], st.by.w), r: num(a[1], st.by.r), h: num(a[2], st.by.h) }; break;
        case "BC": if (!f) f = newField(); f.bc = a; break;
        case "BQ": if (!f) f = newField(); f.bq = a; break;
        case "GB": if (!f) f = newField(); f.gb = a; break;
        case "GC": if (!f) f = newField(); f.gc = a; break;
        case "GE": if (!f) f = newField(); f.gb = [a[0], a[1], a[2], a[3], 8]; break;
        case "GD": if (!f) f = newField(); f.gd = a; break;
        case "GF": if (!f) f = newField(); f.gfArgs = clean(t.arg).split(","); break;
        case "PO": st.po = (a[0] || "N").toUpperCase(); break;
        case "MC": case "PW": case "LL": case "PQ": case "LT": case "LS": case "MN": case "MT": case "MM": case "MD":
        case "PR": case "JM": case "JU": case "SZ": case "PM": case "PA": case "FN": case "XB": case "FP": case "XA": case "XZ": case "CC": case "CT": case "CD":
          break;
        default: if (t.cmd.trim()) warn("^" + t.cmd);
      }
    }
    flush();
    for (const q of queue) {
      if (!q.orient) q.orient = q.fw || "N";
      if (q.gfArgs) { q.gfData = await decodeGF(q.gfArgs); if (!q.gfData) warn("^GF formato no soportado"); drawGraphic(ctx, q); }
      else if (q.gb) drawBox(ctx, q);
      else if (q.gc) drawCircle(ctx, q);
      else if (q.gd) drawDiag(ctx, q);
      else if (q.bc && q.text != null) { st.by = q.by; drawC128(ctx, q, st, warn); }
      else if (q.bq && q.text != null) drawQR(ctx, q, st, warn);
      else if (q.text != null) { st.cf = q.cf; drawText(ctx, q, st); }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    // pure black & white, like the thermal head
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height), px = img.data;
    for (let i = 0; i < px.length; i += 4) {
      const v = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) < 140 ? 0 : 255;
      px[i] = px[i + 1] = px[i + 2] = v; px[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    if (st.po === "I") {
      const c2 = document.createElement("canvas"); c2.width = canvas.width; c2.height = canvas.height;
      const x2 = c2.getContext("2d"); x2.translate(c2.width, c2.height); x2.rotate(Math.PI); x2.drawImage(canvas, 0, 0);
      return { canvas: c2, warnings: [...warnings] };
    }
    return { canvas, warnings: [...warnings] };
  }
  return { splitLabels, renderLabel };
})();

/* =====================================================================
   App
   ===================================================================== */
(() => {
  const $ = id => document.getElementById(id);
  const MM2PT = 72 / 25.4;
  const embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  let downloads = null;
  let current = null; // { pdfBytes, name, zpl, images[] }

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
  }

  // remember label size per browser
  try {
    const saved = JSON.parse(localStorage.getItem("etq-size") || "null");
    if (saved && saved.w && saved.h) { $("wmm").value = saved.w; $("hmm").value = saved.h; }
  } catch (e) {}
  const size = () => ({ w: Math.max(20, +$("wmm").value || 100), h: Math.max(20, +$("hmm").value || 190) });
  const applyPageCss = () => { const s = size(); $("pageSize").textContent = `@page { size: ${s.w}mm ${s.h}mm; margin: 0; }`; };
  applyPageCss();
  ["wmm", "hmm"].forEach(id => $(id).addEventListener("change", () => {
    try { localStorage.setItem("etq-size", JSON.stringify({ w: size().w, h: size().h })); } catch (e) {}
    applyPageCss();
    if (current && current.sources) build(current.sources, current.name);
  }));

  if (embedded) $("btnPrint").style.display = "none";

  function status(msg, cls) { const s = $("status"); s.textContent = msg; s.className = "status" + (cls ? " " + cls : ""); }

  // ---- file intake
  const drop = $("drop");
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { if (e.dataTransfer.files.length) handle([...e.dataTransfer.files]); });
  $("file").addEventListener("change", e => { if (e.target.files.length) handle([...e.target.files]); e.target.value = ""; });
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files.length) handle([...e.dataTransfer.files]); });

  const decodeText = u8 => { try { return new TextDecoder("utf-8", { fatal: true }).decode(u8); } catch (e) { return new TextDecoder("windows-1252").decode(u8); } };
  const isZpl = s => /\^XA/i.test(s);

  async function handle(files) {
    status("Leyendo…");
    try {
      const sources = { zpl: [], pdf: [] };
      let name = null;
      for (const file of files) {
        const buf = new Uint8Array(await file.arrayBuffer());
        const lower = file.name.toLowerCase();
        if (!name) name = file.name.replace(/\.[^.]+$/, "");
        if (lower.endsWith(".zip") || (buf[0] === 0x50 && buf[1] === 0x4B)) {
          if (!window.JSZip) throw new Error("No se pudo cargar el lector de zip (¿sin internet?).");
          const zip = await JSZip.loadAsync(buf);
          const entries = Object.values(zip.files).filter(f => !f.dir && !/(^|\/)(__MACOSX|\.)/.test(f.name)).sort((a, b) => a.name.localeCompare(b.name, "es", { numeric: true }));
          for (const en of entries) {
            const data = await en.async("uint8array");
            const n = en.name.toLowerCase();
            if (n.endsWith(".pdf") || (data[0] === 0x25 && data[1] === 0x50)) sources.pdf.push(data);
            else { const txt = decodeText(data); if (isZpl(txt)) sources.zpl.push(txt); }
          }
        } else if (lower.endsWith(".pdf") || (buf[0] === 0x25 && buf[1] === 0x50)) {
          sources.pdf.push(buf);
        } else {
          const txt = decodeText(buf); if (isZpl(txt)) sources.zpl.push(txt);
        }
      }
      if (!sources.zpl.length && !sources.pdf.length) throw new Error("No encontré ninguna etiqueta en ese archivo.");
      await build(sources, name || "Etiquetas");
    } catch (e) {
      console.error(e);
      status(e.message || "No pude leer el archivo.", "err");
    }
  }

  async function build(sources, name) {
    if (!window.PDFLib) throw new Error("No se pudo cargar el generador de PDF (¿sin internet?).");
    const { PDFDocument } = PDFLib;
    const s = size(), Wpt = s.w * MM2PT, Hpt = s.h * MM2PT;
    const doc = await PDFDocument.create();
    doc.setTitle(name); doc.setCreator("Etiquetas MercadoEnvíos");
    const images = [], warns = new Set();
    let zplText = "";
    if (sources.zpl.length) {
      status("Dibujando etiquetas…");
      try { await document.fonts.load(`700 40px "LabelCn"`); await document.fonts.load(`400 40px "LabelCn"`); } catch (e) {}
      zplText = sources.zpl.join("\n");
      const labels = sources.zpl.flatMap(t => ZPL.splitLabels(t));
      for (const body of labels) {
        const { canvas, warnings } = await ZPL.renderLabel(body, { wmm: s.w, hmm: s.h, scale: 2 });
        warnings.forEach(w => warns.add(w));
        const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
        const png = new Uint8Array(await blob.arrayBuffer());
        const img = await doc.embedPng(png);
        doc.addPage([Wpt, Hpt]).drawImage(img, { x: 0, y: 0, width: Wpt, height: Hpt });
        images.push(URL.createObjectURL(blob));
      }
    } else {
      status("Ajustando el PDF…");
      for (const bytes of sources.pdf) {
        const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
        const pages = await doc.embedPages(src.getPages());
        for (const ep of pages) {
          const k = Math.min(Wpt / ep.width, Hpt / ep.height);
          const w = ep.width * k, h = ep.height * k;
          doc.addPage([Wpt, Hpt]).drawPage(ep, { x: (Wpt - w) / 2, y: Hpt - h, width: w, height: h });
        }
      }
    }
    const pdfBytes = await doc.save();
    if (current && current.images) current.images.forEach(u => URL.revokeObjectURL(u));
    current = { pdfBytes, name, zpl: zplText, images, sources, pages: doc.getPageCount() };
    show(warns);
  }

  function show(warns) {
    const n = current.pages, s = size();
    status(`${n === 1 ? "1 etiqueta lista" : n + " etiquetas listas"} · ${s.w}×${s.h} mm`, "ok");
    const box = $("labels"); box.innerHTML = "";
    const pa = $("printArea"); pa.innerHTML = "";
    current.images.forEach((u, i) => {
      const fig = document.createElement("figure");
      const img = document.createElement("img"); img.src = u; img.alt = "Etiqueta " + (i + 1);
      const cap = document.createElement("figcaption"); cap.textContent = "Etiqueta " + (i + 1);
      fig.append(img, cap); box.append(fig);
      const p = document.createElement("img"); p.src = u; p.style.width = s.w + "mm"; p.style.height = s.h + "mm"; pa.append(p);
    });
    if (!current.images.length) box.innerHTML = `<p class="hint">El zip traía solo PDF: lo acomodé a ${s.w}×${s.h} mm (no tengo vista previa para este caso).</p>`;
    $("zplBox").style.display = current.zpl ? "" : "none";
    $("btnCopy").style.display = current.zpl ? "" : "none";
    $("zplText").value = current.zpl;
    $("hint").textContent = embedded
      ? "Para imprimir: abrí el PDF descargado, Imprimir, elegí la térmica y escala 100 % (tamaño real)."
      : "Al imprimir: elegí la térmica, papel " + s.w + "×" + s.h + " mm y escala 100 % (tamaño real).";
    const wl = [...warns].filter(Boolean);
    $("warnlist").textContent = wl.length ? "Aviso: la etiqueta tiene comandos que no dibujo (" + wl.join(", ") + "). Revisá la vista previa antes de imprimir." : "";
    $("result").classList.add("show");
  }

  const fileName = () => (current.name || "Etiquetas").replace(/[\\/:*?"<>|]+/g, "_") + ".pdf";

  $("btnDownload").addEventListener("click", async () => {
    if (!current) return;
    const blob = new Blob([current.pdfBytes], { type: "application/pdf" });
    if (downloads) {
      try { await downloads.save({ filename: fileName(), data: blob }); status("PDF guardado.", "ok"); }
      catch (e) { if (e && e.code !== "declined") status("No se pudo guardar el PDF.", "err"); }
      return;
    }
    if (embedded) { status("La descarga no está disponible en esta vista. Abrí la app en su propia pestaña.", "warn"); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  });

  $("btnPrint").addEventListener("click", () => {
    if (!current) return;
    if (current.images.length) { window.print(); return; }
    // PDF-only case: print the generated PDF through a hidden frame
    const url = URL.createObjectURL(new Blob([current.pdfBytes], { type: "application/pdf" }));
    const fr = document.createElement("iframe"); fr.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
    fr.src = url; document.body.append(fr);
    fr.onload = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { window.open(url, "_blank"); } };
  });

  $("btnCopy").addEventListener("click", async () => {
    if (!current || !current.zpl) return;
    try { await navigator.clipboard.writeText(current.zpl); status("Código ZPL copiado.", "ok"); }
    catch (e) { const t = $("zplText"); $("zplBox").open = true; t.focus(); t.select(); try { document.execCommand("copy"); status("Código ZPL copiado.", "ok"); } catch (e2) { status("Seleccioná el código y copialo a mano.", "warn"); } }
  });

  $("btnReset").addEventListener("click", () => { $("result").classList.remove("show"); status(""); $("file").click(); });
})();
</script>
</body>
